name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - api/**
      - assets/**
      - scripts/ci/check-repository-policy.sh
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install documentation dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile
      - name: Check documentation links and API snapshot
        working-directory: docs-site
        run: |
          bun run check:links
          bun run check:openapi
      - name: Build static site
        working-directory: docs-site
        run: bun run build:pages
      - name: Type-check documentation site
        working-directory: docs-site
        run: bun run lint
      - name: Prepare Pages artifact
        working-directory: docs-site
        run: touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
