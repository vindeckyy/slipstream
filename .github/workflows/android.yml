name: Android

on:
  push:
    branches: [main]
    paths:
      - clients/android/**
      - crates/slipstream-core/**
      - crates/ss-client-core/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/android.yml
  pull_request:
    paths:
      - clients/android/**
      - crates/slipstream-core/**
      - crates/ss-client-core/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Android unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libopus-dev

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;30.0.14904198" "cmake;3.22.1"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Android tests and build
        working-directory: clients/android
        env:
          VERSION_NAME: 0.0.0-ci
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
