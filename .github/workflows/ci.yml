name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config cmake             libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev             libavdevice-dev libpipewire-0.3-dev libopus-dev libwayland-dev libxkbcommon-dev             libgl-dev libegl-dev libgbm-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy

      - run: cargo fmt --all --check
      # The full workspace contains platform clients with separate system SDK requirements.
      # Keep this required gate on the portable core crates and their focused test suites.
      - run: cargo clippy -p slipstream-core -p ss-host-config -p ss-update-check --all-targets --locked -- -D warnings
      - run: cargo test -p slipstream-core -p ss-host-config -p ss-update-check --locked
      - run: cargo check -p slipstream-host --locked
      - run: cargo test -p slipstream-host --locked
      - name: Verify generated C header
        run: git diff --exit-code -- include/slipstream_core.h
      - name: Verify generated OpenAPI
        run: |
          cargo run -p slipstream-host --locked -- openapi > "$RUNNER_TEMP/openapi.json"
          cmp "$RUNNER_TEMP/openapi.json" api/openapi.json
          cmp api/openapi.json docs-site/public/openapi.json

  linux-client:
    name: Linux client compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev \
            libavdevice-dev libpipewire-0.3-dev libopus-dev libwayland-dev libxkbcommon-dev \
            libgl-dev libegl-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned
        with:
          toolchain: 1.96.0
      - name: Check Linux shell source
        env:
          DOCS_RS: "1"
        run: cargo check --locked -p slipstream-client-linux
      - name: Download pinned Skia archive
        run: |
          curl -fL https://github.com/rust-skia/skia-binaries/releases/download/0.87.0/skia-binaries-e551f334ad5cbdf43abf-x86_64-unknown-linux-gnu-pdf-textlayout-vulkan.tar.gz \
            -o "$RUNNER_TEMP/skia-binaries.tar.gz"
          echo "b46e7061e6b9df792025acaf9b8b90180224c7cec63f4c3ce09af7ddddb8abfa  $RUNNER_TEMP/skia-binaries.tar.gz" \
            | sha256sum --check
      - name: Check session and CLI source
        env:
          SKIA_BINARIES_URL: file://${{ runner.temp }}/skia-binaries.tar.gz
          PF_FFVK_VULKAN_INCLUDE: /usr/include
        run: cargo check --locked -p slipstream-client-session -p slipstream-cli

  web:
    name: Web console
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun test

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:links
      - run: bun run build
      - run: bun run check:openapi
      - run: bun run lint

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Verify generated client
        run: |
          bun run gen
          git diff --exit-code -- src/gen/slipstream.ts

  decky:
    name: Decky plugin
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/decky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.12.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run package
      - name: Verify package
        run: |
          version="$(node -p 'require("./package.json").version')"
          test -s "out/slipstream-v${version}.zip"
