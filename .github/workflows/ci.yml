name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config cmake             libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev             libavdevice-dev libpipewire-0.3-dev libopus-dev libwayland-dev libxkbcommon-dev             libgl-dev libegl-dev libgbm-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy

      - run: cargo fmt --all --check
      # The full workspace contains platform clients with separate system SDK requirements.
      # Keep this required gate on the portable core crates and their focused test suites.
      - run: cargo clippy -p slipstream-core -p ss-host-config -p ss-update-check --all-targets --locked -- -D warnings
      - run: cargo test -p slipstream-core -p ss-host-config -p ss-update-check --locked

  web:
    name: Web console
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun test

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:links
      - run: bun run build
      - run: bun run lint
