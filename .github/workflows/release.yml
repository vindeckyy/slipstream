name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-host:
    name: Linux host release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config cmake             libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev             libavdevice-dev libpipewire-0.3-dev libopus-dev libwayland-dev libxkbcommon-dev             libgl-dev libegl-dev libgbm-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Build host
        run: cargo build --release -p slipstream-host --locked

      - name: Package and checksum
        run: |
          mkdir -p release
          cp target/release/slipstream-host release/slipstream-host-linux-x86_64
          tar -C release -czf slipstream-host-${GITHUB_REF_NAME}-linux-x86_64.tar.gz slipstream-host-linux-x86_64
          sha256sum slipstream-host-${GITHUB_REF_NAME}-linux-x86_64.tar.gz             > slipstream-host-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            slipstream-host-${{ github.ref_name }}-linux-x86_64.tar.gz
            slipstream-host-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
