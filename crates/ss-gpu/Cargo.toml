# GPU vendor/adapter detection + selection + the live-session record, extracted into a leaf crate so
# every subsystem crate (ss-encode, ss-capture, ss-vdisplay) can consult the selected GPU WITHOUT
# depending on the orchestrator (plan §W6). Self-contained: reads config + writes the pref store.
[package]
name = "ss-gpu"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "slipstream host GPU vendor/adapter enumeration, selection preference, and active-session accounting."
publish = false

[dependencies]
ss-host-config = { path = "../ss-host-config" }
ss-paths = { path = "../ss-paths" }
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
