[package]
name = "ss-presenter"
description = "The Linux Vulkan session presenter: SDL3 window, ash swapchain, frame present, and input capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The Linux session client shares this presenter plumbing.
[target.'cfg(target_os = "linux")'.dependencies]
# `default-features = false`: the PyroWave decode backend is turned on through THIS crate's own
# `pyrowave` feature (which re-exports it below), never by inheriting the dependency's default.
# Otherwise a consumer that deliberately builds us without `pyrowave` still drags the vendored
# C++ in, which is only needed by the Linux client build.
ss-client-core = { path = "../ss-client-core", default-features = false }
# AVVkFrame access (Vulkan Video frames: live sync state under the frames lock).
ss-ffvk = { path = "../ss-ffvk" }
slipstream-core = { path = "../slipstream-core", features = ["quic"] }

# `loaded` dlopens libvulkan at runtime (no link-time dependency — GPU-less boxes still
# start and fail into a clean error when no Vulkan loader is available.
# `ash` on sdl3 types SDL_Vulkan_CreateSurface with ash 0.38 handles so the surface
# hands over without transmutes.
ash = { version = "0.38", features = ["loaded"] }

async-channel = "2"
anyhow = "1"
tracing = "0.1"

# Linux links the system SDL3.
sdl3 = { version = "0.18", features = ["hidapi", "ash"] }

[features]
# PyroWave planar present path (the wired-LAN wavelet codec) — forwards to the decode
# backend in ss-client-core; ON by default, matching ss-client-core's default.
default = ["pyrowave"]
pyrowave = ["ss-client-core/pyrowave"]

[lints]
workspace = true
