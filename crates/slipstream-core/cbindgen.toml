language = "C"
pragma_once = true
include_guard = "SLIPSTREAM_CORE_H"
autogen_warning = "/* Generated by cbindgen from slipstream-core. Do not edit by hand. */"
header = "/* slipstream-core C ABI — see crates/slipstream-core/src/abi.rs */"
style = "type"
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "c99"

[parse]
parse_deps = false

[export]
# Internal platform-only FFI — NOT part of the C ABI. cbindgen otherwise sweeps the foreign
# imports and their #[repr(C)] structs into the header, where socklen_t/ssize_t/iovec/msghdr are
# undefined and the C harness fails to compile: the Apple batched recv (transport/udp.rs
# `recvmsg_x` + `MsghdrX`) and the Android bionic mmsg bindings (`android_mmsg` module).
exclude = ["MsghdrX", "recvmsg_x", "mmsghdr", "sendmmsg", "recvmmsg"]
# The V2 stats surface is filled through `void *out` (append-only caller-sized contract), so
# nothing in the exported fn signatures reaches the struct — include it explicitly.
include = ["SlipstreamStatsV2"]

[export.rename]
"InputEvent" = "SlipstreamInputEvent"
"InputKind" = "SlipstreamInputKind"
# Gamepad wire constants: bare BTN_* names collide with <linux/input-event-codes.h> (at
# DIFFERENT values — last definition silently wins); prefix everything we export.
"BTN_DPAD_UP" = "SLIPSTREAM_BTN_DPAD_UP"
"BTN_DPAD_DOWN" = "SLIPSTREAM_BTN_DPAD_DOWN"
"BTN_DPAD_LEFT" = "SLIPSTREAM_BTN_DPAD_LEFT"
"BTN_DPAD_RIGHT" = "SLIPSTREAM_BTN_DPAD_RIGHT"
"BTN_START" = "SLIPSTREAM_BTN_START"
"BTN_BACK" = "SLIPSTREAM_BTN_BACK"
"BTN_LS_CLICK" = "SLIPSTREAM_BTN_LS_CLICK"
"BTN_RS_CLICK" = "SLIPSTREAM_BTN_RS_CLICK"
"BTN_LB" = "SLIPSTREAM_BTN_LB"
"BTN_RB" = "SLIPSTREAM_BTN_RB"
"BTN_GUIDE" = "SLIPSTREAM_BTN_GUIDE"
"BTN_A" = "SLIPSTREAM_BTN_A"
"BTN_B" = "SLIPSTREAM_BTN_B"
"BTN_X" = "SLIPSTREAM_BTN_X"
"BTN_Y" = "SLIPSTREAM_BTN_Y"
"BTN_TOUCHPAD" = "SLIPSTREAM_BTN_TOUCHPAD"
"AXIS_LS_X" = "SLIPSTREAM_AXIS_LS_X"
"AXIS_LS_Y" = "SLIPSTREAM_AXIS_LS_Y"
"AXIS_RS_X" = "SLIPSTREAM_AXIS_RS_X"
"AXIS_RS_Y" = "SLIPSTREAM_AXIS_RS_Y"
"AXIS_LT" = "SLIPSTREAM_AXIS_LT"
"AXIS_RT" = "SLIPSTREAM_AXIS_RT"
"AUDIO_MAGIC" = "SLIPSTREAM_AUDIO_MAGIC"
"RUMBLE_MAGIC" = "SLIPSTREAM_RUMBLE_MAGIC"

# QualifiedScreamingSnakeCase already qualifies each variant with the enum name
# (SlipstreamStatus::Ok -> SLIPSTREAM_STATUS_OK); do NOT also set prefix_with_name or it doubles.
[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
sort_by = "None"

[struct]
derive_eq = false

[defines]
"feature = quic" = "SLIPSTREAM_FEATURE_QUIC"
