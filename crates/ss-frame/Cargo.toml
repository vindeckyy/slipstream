# Shared frame and format types used by the Linux capture and encode paths.
[package]
name = "ss-frame"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "slipstream host shared frame and format vocabulary: CapturedFrame, PixelFormat, HDR metadata, and thread QoS."
publish = false

[dependencies]
slipstream-core = { path = "../slipstream-core", features = ["quic"] }
anyhow = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# `FramePayload::Cuda` owns a zero-copy `DeviceBuffer`; `libc` for the per-thread `setpriority`.
ss-zerocopy = { path = "../ss-zerocopy" }
libc = "0.2"

[lints]
workspace = true
