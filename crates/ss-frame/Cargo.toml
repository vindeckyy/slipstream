# Shared frame and format types used by the Linux capture and encode paths.
[package]
name = "ss-frame"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "slipstream host shared frame and format vocabulary: CapturedFrame, PixelFormat, HDR metadata, and thread QoS."
publish = false

[dependencies]
slipstream-core = { path = "../slipstream-core", features = ["quic"] }
anyhow = "1"
tracing = "0.1"
# `worker_qos` reads thread scheduling state; `libc` is portable (Windows stubs compile,
# Linux-only syscalls stay behind `cfg(target_os = "linux")` in the module).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# `FramePayload::Cuda` owns a zero-copy `DeviceBuffer`.
ss-zerocopy = { path = "../ss-zerocopy" }

[target.'cfg(target_os = "windows")'.dependencies]
# MMCSS (`AvSetMmThreadCharacteristicsW`) for the low-latency worker profile.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
