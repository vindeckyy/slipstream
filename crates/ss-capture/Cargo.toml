# Frame capture: the Linux xdg-ScreenCast/PipeWire portal capturer, plus the synthetic sources and
# the Capturer trait, extracted into a subsystem crate. Depends on the shared frame vocabulary
# (ss-frame) and the zero-copy plumbing (ss-zerocopy), never on ss-encode: the encode-backend
# facts arrive pre-resolved (ZeroCopyPolicy) and the sealed-channel delivery as a closure
# (FrameChannelSender), so the capture→encode edge is one-way (plan §2.4).
[package]
name = "ss-capture"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "slipstream host frame capture: Linux PipeWire portal capturers behind one Capturer trait."
publish = false

[dependencies]
slipstream-core = { path = "../slipstream-core", features = ["quic"] }
ss-frame = { path = "../ss-frame" }
ss-zerocopy = { path = "../ss-zerocopy" }
ss-gpu = { path = "../ss-gpu" }
ss-host-config = { path = "../ss-host-config" }
anyhow = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# The xdg ScreenCast + RemoteDesktop portals, and the PipeWire consumer for the capture frames.
ashpd = { version = "0.13", features = ["screencast", "remote_desktop"] }
pipewire = "0.9"
libc = "0.2"
# ashpd 0.13 uses the tokio runtime for the one-time portal handshake (control plane).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
# XFixes cursor source for gamescope (remote-desktop-sweep Phase C): gamescope paints no
# `SPA_META_Cursor`, so the pointer never reaches the PipeWire node. We read the shape/hotspot/
# visibility from gamescope's nested Xwayland via XFixes instead and feed the existing cursor slot.
# `RustConnection` is the pure-Rust default (no libxcb link → no new C dependency on the host); the
# `xfixes` feature (auto-pulls `render` + `shape`) is what exposes GetCursorImage/SelectCursorInput.
# `randr` is for the X11 GetImage capturer (linux/x11.rs), which crops to the primary output's CRTC.
x11rb = { version = "0.13", default-features = false, features = ["randr", "xfixes"] }
# NvFBC is an NVIDIA-driver-only optional capture API. Load it at runtime so the same Linux
# binary remains usable on AMD/Intel and on NVIDIA systems without the FBC library.
libloading = "0.8"
# wlroots `zwlr_screencopy_manager_v1` SHM capturer (linux/wlr.rs). Same stack as ss-inject's
# virtual-input path; `wayland-backend` is referenced by the generated interface tables.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-backend = "0.3"

[lints]
workspace = true
