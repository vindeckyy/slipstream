# Input injection: wlroots virtual-input, KWin fake_input, libei/reis, gamescope-EI, and the
# virtual-gamepad HID stack on Linux, extracted into a subsystem crate. Consumes
# slipstream_core::input (the neutral GamepadEvent/InputEvent vocabulary) and never reaches the
# gamescope-EI socket path is the shared ss-paths contract, not a vdisplay reach-in).
[package]
name = "ss-inject"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "slipstream host input injection: per-OS keyboard/mouse injectors + the virtual-gamepad HID backends behind one InputInjector trait."
publish = false

[dependencies]
slipstream-core = { path = "../slipstream-core", features = ["quic"] }
ss-host-config = { path = "../ss-host-config" }
ss-paths = { path = "../ss-paths" }
# The shared frame vocabulary — `worker_qos` (Phase-7 opt-in worker scheduling) rides here.
ss-frame = { path = "../ss-frame" }
# The host cursor state is shared with the Linux capture path.
ss-capture = { path = "../ss-capture" }
anyhow = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
parking_lot = "0.12"
# Host-cursor hide (XFixes) + gamescope XFixes cursor source share this stack.
x11rb = { version = "0.13", default-features = false, features = ["xfixes"] }
# The RemoteDesktop portal for the libei injector on KWin/GNOME (headless grant via kde-authorized).
ashpd = { version = "0.13", features = ["remote_desktop"] }
# Input injection into headless Sway via the wlroots virtual-input Wayland protocols.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
# Codegen for KDE's `org_kde_kwin_fake_input` (vendored in `protocols/fake-input.xml`); the generated
# interface tables reference `wayland-backend`.
wayland-scanner = "0.31"
wayland-backend = "0.3"
# libei (EI sender) for the portable input path on KWin/GNOME (RemoteDesktop portal) + gamescope-EI.
reis = { version = "0.6.1", features = ["tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
# Builds/validates the xkb keymap uploaded to the virtual keyboard + tracks modifier state.
xkbcommon = "0.8"
# Vendored + trimmed usbip server core — presents a virtual Steam Deck over USB/IP for Steam Input.
usbip-sim = { path = "../slipstream-host/vendor/usbip-sim" }

[lints]
workspace = true
