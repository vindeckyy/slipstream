[package]
name = "ss-client-core"
description = "Shared Linux client plumbing: session pump, FFmpeg decode, PipeWire audio, SDL3 gamepads, trust store, and discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The Linux Vulkan session client uses this shared implementation.
[target.'cfg(target_os = "linux")'.dependencies]
slipstream-core = { path = "../slipstream-core", features = ["quic"] }
# FFmpeg's Vulkan hwcontext surface (Vulkan Video decode on the presenter's device).
ss-ffvk = { path = "../ss-ffvk" }
async-channel = "2"

# Video decode (same FFmpeg pin as the host) and Opus for the audio planes.
ffmpeg-next = "9"
opus = "0.3"

mdns-sd = "0.20"

# PyroWave decode (the opt-in wired-LAN wavelet codec, design/pyrowave-codec-plan.md
# section 4.5: pure Vulkan compute on the presenter's shared device. `ash` only wraps the
# presenter's existing raw handles
# (same pinned version as ss-presenter).
pyrowave-sys = { path = "../pyrowave-sys", optional = true }
ash = { version = "0.38", optional = true }
# Game-library fetch from the host's management API over mTLS + fingerprint pinning.
# `ureq` is small + sync (the host uses it too) and its rustls unifies with the
# workspace's (quinn's) 0.23; the pinning verifier mirrors core's private `PinVerify`.
ureq = "2"
# Signed update-manifest fetch/verify + the install-kind ladder, shared with the host so one
# trust rule serves both (crates/ss-update-check).
ss-update-check = { path = "../ss-update-check" }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
# Stable ids for profiles and host records (profiles.rs) — the OS RNG only, same version the
# workspace already resolves for slipstream-core. No uuid crate: the v4 layout is four lines.
rand = "0.9"

# Gamepads: capture and feedback, including touchpad, motion, triggers, and LEDs.
# Linux links the system SDL3.
pipewire = "0.9"
sdl3 = { version = "0.18", features = ["hidapi"] }


[features]
# PyroWave client decode ships in every default build (flatpak included; pyrowave-sys is a
# vendored in-repo tree and is built offline). The codec is
# still strictly per-session opt-in (Settings codec pick / SLIPSTREAM_PREFER_PYROWAVE=1).
default = ["pyrowave"]
pyrowave = ["dep:pyrowave-sys", "dep:ash"]

[lints]
workspace = true
