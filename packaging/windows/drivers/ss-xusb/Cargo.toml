# ss-xusb - slipstream virtual Xbox 360 XUSB companion (UMDF2, classic XInput).
# A member of the in-tree drivers workspace (shares the vendored wdk-sys/wdk-build with the bindgen pin
# + the crt-static .cargo/config), built from source per release like ss-vdisplay.
[package]
name = "ss-xusb"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "slipstream virtual Xbox 360 XUSB companion (UMDF2 - classic XInput)"

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 31

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build.workspace = true

[dependencies]
wdk.workspace = true
wdk-sys.workspace = true
ss-driver-proto.workspace = true
ss-umdf-util.workspace = true

[features]
default = []
nightly = ["wdk-sys/nightly", "wdk/nightly"]
