# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.6.0.schema.json
PackageIdentifier: vindeckyy.SlipstreamHost
PackageVersion: 0.19.2
PackageLocale: en-US

Publisher: unom
PublisherUrl: https://github.com/vindeckyy/slipstream/slipstream
PublisherSupportUrl: https://github.com/vindeckyy/slipstream/slipstream/issues
PackageName: Slipstream Host
PackageUrl: https://docs.slipstream.unom.io/docs/windows-host
License: MIT OR Apache-2.0
LicenseUrl: https://github.com/vindeckyy/slipstream/slipstream/src/branch/main/LICENSE-MIT
Copyright: Copyright (c) unom
ShortDescription: Low-latency game-streaming host — stream your PC's games to any Slipstream or Moonlight client.
Description: |-
  Slipstream Host turns a Windows 11 PC into a low-latency game-streaming server. It captures the
  desktop or a dedicated virtual display, encodes with NVENC / AMF / QSV / Vulkan, and streams over
  its native QUIC protocol to Slipstream clients on Windows, macOS, iOS, tvOS, Android and Linux —
  or over GameStream to stock Moonlight clients.

  The installer bundles the ss-vdisplay virtual display driver (native-resolution and HDR streaming
  without a physical monitor), virtual DualSense / DualShock 4 / Xbox 360 gamepads, and a web
  management console served on port 47992.
Moniker: slipstream-host
Tags:
  - game-streaming
  - remote-desktop
  - moonlight
  - gamestream
  - streaming
  - remote-play
ReleaseNotesUrl: https://github.com/vindeckyy/slipstream/slipstream/src/branch/main/docs/releases/v0.19.2.md
Documentations:
  - DocumentLabel: Windows Host Setup
    DocumentUrl: https://docs.slipstream.unom.io/docs/windows-host

# Shown BEFORE download/install; the user must accept or the install does not proceed. This is what
# carries — on the unattended path, where no wizard page is on screen — the disclosures the wizard
# puts in its task text. VB-Audio's bundling grant specifically requires the end user to see
# VB-CABLE's origin + donationware status at install time.
Agreements:
  - AgreementLabel: Bundled virtual audio (VB-CABLE by VB-Audio)
    Agreement: >-
      Slipstream's streaming microphone uses VB-CABLE by VB-Audio (www.vb-cable.com), which this
      installer bundles and installs. VB-CABLE is donationware — all participations welcome. It is
      redistributed under VB-Audio's bundling grant; the full notice is installed to
      %ProgramFiles%\slipstream\licenses\VB-CABLE-NOTICE.txt.
    AgreementUrl: https://vb-audio.com/Cable/
  - AgreementLabel: GameStream (Moonlight) compatibility is OFF by default
    Agreement: >-
      Slipstream's own clients work out of the box. Support for stock Moonlight clients is a separate,
      opt-in plane, because it pairs over legacy plain HTTP and is intended for trusted LANs only. To
      install WITH it, use --override "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
      /MERGETASKS=gamestream", or run --interactive and tick the GameStream checkbox. It can also be
      turned on later with `slipstream-host service install --gamestream=on` (or via
      SLIPSTREAM_HOST_CMD in %ProgramData%\slipstream\host.env), followed by a service restart.
    AgreementUrl: https://docs.slipstream.unom.io/docs/windows-host

# Displayed after the install completes. The console password is generated per install, so it can
# only be pointed at, never printed here — this text is fixed at publish time.
InstallationNotes: |-
  Web management console:  https://<this-PC>:47992
    The login password was generated during installation and is stored in
    %ProgramData%\slipstream\web-password  (edit that file to change it).

  Configuration:  %ProgramData%\slipstream\host.env
  Logs:           %ProgramData%\slipstream\logs\

  The host service starts automatically at boot. `slipstream-host` is on the machine PATH — run
  `slipstream-host service status` from an elevated prompt to check it.

ManifestType: defaultLocale
ManifestVersion: 1.6.0
