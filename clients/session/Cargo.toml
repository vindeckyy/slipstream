[package]
name = "slipstream-client-session"
description = "slipstream/1 Vulkan session binary — SDL3 window, ash presenter, terminal stats; the power-user / gamescope stream client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "slipstream-session"
path = "src/main.rs"

[features]
default = ["ui", "pyrowave"]
# PyroWave client decode (the wired-LAN wavelet codec) enables the decode backend and the
# planar present path. ON by default; each session still opts in explicitly (the Settings
# codec pick, or SLIPSTREAM_PREFER_PYROWAVE=1).
pyrowave = ["ss-client-core/pyrowave", "ss-presenter/pyrowave"]
# The Skia console UI (stats OSD, capture HUD, later the gamepad library). Dropping it
# (`--no-default-features`) is the ~15 MB-smaller power-user build: same streaming,
# stats on stdout only.
ui = ["dep:ss-console-ui", "dep:serde_json"]

# The session binary is built for Linux; other platforms retain a small stub in `main.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
# `default-features = false` on both: THIS crate's `pyrowave` feature (above) is the single
# switch that turns the wavelet codec on, and it enables it explicitly on each. Inheriting their
# defaults instead would make `--no-default-features` a lie.
ss-presenter = { path = "../../crates/ss-presenter", default-features = false }
ss-console-ui = { path = "../../crates/ss-console-ui", optional = true }
ss-client-core = { path = "../../crates/ss-client-core", default-features = false }
slipstream-core = { path = "../../crates/slipstream-core", features = ["quic"] }
# The fake-library dev hook (`SLIPSTREAM_FAKE_LIBRARY`, browse mode) parses GameEntry JSON.
serde_json = { version = "1", optional = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# This crate carries NO toolkit, deliberately: it is the renderer the shells spawn, and the
# `--no-default-features` build is what a minimal/embedded image installs. GTK4/libadwaita/relm4
# belong to `clients/linux` (the shell) and must never appear here — a stray copy of the shell's
# modules landed in src/ once (b0ea1e6b) and dragging its dependencies in behind it is what let
# the wrong `main.rs` build and ship as `slipstream-session`.

[lints]
workspace = true
