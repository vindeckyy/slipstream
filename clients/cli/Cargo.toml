[package]
name = "slipstream-cli"
description = "slipstream — the headless client CLI: pair, list and edit hosts, wake, enumerate a library, start a stream, open a slipstream:// URL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The binary is `slipstream` — the command users and plugins type. The crate name carries the
# `-cli` suffix only because `slipstream` is taken by the workspace's own naming.
[[bin]]
name = "slipstream"
path = "src/main.rs"

# Console subsystem, no GUI toolkit: this links `ss-client-core` (the brain) and nothing else
# UI-shaped, which is what lets it ship in every client package without dragging GTK or
# Skia along (design/client-architecture-split.md §4).
[target.'cfg(target_os = "linux")'.dependencies]
ss-client-core = { path = "../../crates/ss-client-core", default-features = false }
slipstream-core = { path = "../../crates/slipstream-core", features = ["quic"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
