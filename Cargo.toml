[workspace]
resolver = "2"
members = [
    "crates/slipstream-core",
    "crates/slipstream-host",
    "crates/slipstream-client-rs",
    "crates/slipstream-client-linux",
    "crates/slipstream-client-windows",
    "crates/slipstream-android",
    "tools/latency-probe",
    "tools/loss-harness",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["unom"]
repository = "https://github.com/vindeckyy/slipstream.git"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# NOTE: deliberately NOT `panic = "abort"`. slipstream-core ships as a cdylib/staticlib into
# third-party apps (Swift/Kotlin/C) and its C ABI catches panics at the boundary
# (`catch_unwind` → `SlipstreamStatus::Panic`). `panic = "abort"` would make that guard a
# no-op and let a stray panic abort the embedding application. Unwinding keeps the
# documented isolation guarantee real.

# The per-frame hot path must stay fast even in dev builds.
[profile.dev.package."*"]
opt-level = 2
