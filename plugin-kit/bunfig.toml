# Resolve the `@slipstream` scope from the private plugin registry. During local development the
# SDK is consumed via the `link:../sdk` / `file:../sdk` devDependency; this matters once the kit
# is depended on from outside the repo. Override with SLIPSTREAM_PLUGIN_REGISTRY when installing
# plugins via the host runner.
[install.scopes]
"@slipstream" = "https://npm.pkg.github.com"
